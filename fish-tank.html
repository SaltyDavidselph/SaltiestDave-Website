<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Tank — Dave's Website</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Set theme before first paint to avoid a flash of the wrong colors.
    const savedTheme = localStorage.getItem("theme");
    const theme = savedTheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  </script>
</head>
<body>
  <header>
    <button id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="fish-tank.html" class="active">Fish Tank</a>
    </nav>
    <h1>🐠 Fish Tank</h1>
    <p>A little tank living entirely in CSS.</p>
  </header>

  <main>
    <div class="tank">
      <div class="fish fish-1">🐟</div>
      <div class="fish fish-2">🐠</div>
      <div class="fish fish-3">🐡</div>
      <div class="fish fish-4">🐟</div>
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
      <div class="bubble bubble-4"></div>
      <div class="seaweed seaweed-1"></div>
      <div class="seaweed seaweed-2"></div>
      <div class="seaweed seaweed-3"></div>
    </div>
  </main>

  <footer>
    <p>Built by Dave &mdash; <span id="year"></span></p>
  </footer>

  <div id="flash-overlay">My Eyessss!</div>

  <script src="js/script.js"></script>
</body>
</html>
